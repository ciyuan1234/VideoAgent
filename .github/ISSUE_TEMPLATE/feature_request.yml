name: 💡 功能建议 (Feature Request)
description: 为 VideoAgent 提出新特性、新原语或体验改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 VideoAgent 提出改进建议或新原语构想！
  - type: textarea
    id: feature-description
    attributes:
      label: 期望的新功能或优化 (Proposed Feature)
      description: 请清晰描述你希望增加的功能或改进
      placeholder: 例如：希望在竖屏 launch_teaser 中增加代码卡片原语...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 应用场景与痛点 (Motivation & Use Case)
      description: 该功能能解决什么具体问题？
    validations:
      required: false
